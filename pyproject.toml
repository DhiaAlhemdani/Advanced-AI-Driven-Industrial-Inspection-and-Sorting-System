[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-inspection-showcase"
version = "0.1.0"
description = "Reproducibility utilities for an industrial inspection and sorting project"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Deiaa Ahmed Abdo Lootf" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9"
]
pdf = [
  "pypdf>=5.0,<7",
  "reportlab>=4.0,<5"
]

[project.scripts]
dataset-report = "industrial_inspection.dataset_report:main"
benchmark-summary = "industrial_inspection.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
