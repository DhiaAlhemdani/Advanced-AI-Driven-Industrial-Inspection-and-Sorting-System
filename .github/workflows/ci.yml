name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python utilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Compile source
        run: python -m compileall -q src
